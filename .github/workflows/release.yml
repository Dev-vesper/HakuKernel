name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  HAKU_BOOT_DELAY: "3"
  HAKU_HEADLESS_TIMEOUT: "60"

jobs:
  release:
    name: Package bootable images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install NASM, LLVM, and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm clang lld qemu-system-x86

      - name: Build and run headless tests
        run: python build.py headless

      - name: Rebuild a pristine data image
        run: |
          rm -f build/haku_fs.img
          python build.py

      - name: Package release
        run: |
          set -euo pipefail
          mkdir -p package
          cp haku.img README.md LICENSE build/haku_fs.img package/
          (cd package && sha256sum haku.img haku_fs.img > SHA256SUMS.txt)
          (cd package && zip -q -r "../Haku-${GITHUB_REF_NAME}.zip" .)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Haku-${{ github.ref_name }}.zip
            package/SHA256SUMS.txt
          generate_release_notes: true
